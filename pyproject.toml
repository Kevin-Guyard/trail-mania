[project]
name = "trail-mania"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
    "flet>=1.0.5",
    "sqlalchemy>=2.1.6",
    "trail-mania-drive==0.1.0",
]
[dependency-groups]
dev = [
    "flet-cli>=1.0.5",
    "flet-desktop>=1.0.5",
    "flet-web>=1.0.5",
]

[tool.flet]
product = "TrailMania"

[tool.flet.app]
path = "src"
module = "main"

[tool.uv.sources]
trail-mania-drive = { path = "extensions/trail-mania-drive" }

[tool.flet.dev_packages]
trail-mania-drive = "extensions/trail-mania-drive"
